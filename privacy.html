    <script>
      (function () {
        try { if (typeof history !== 'undefined' && 'scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
        try {
          var raw = typeof sessionStorage !== 'undefined' && sessionStorage.getItem ? sessionStorage.getItem('GR_SCROLL_RESTORE') : null;
          if (raw != null) {
            var y = parseInt(raw, 10);
            if (isFinite(y) && y > 0) {
              document.documentElement.style.scrollBehavior = 'auto';
              window.scrollTo(0, y);
              var prevY = y;
              var _t0 = setInterval(function () { window.scrollTo(0, prevY); }, 8);
              setTimeout(function () { clearInterval(_t0); window.scrollTo(0, prevY); }, 80);
              window.addEventListener('load', function () { window.scrollTo(0, prevY); }, { once: true });
            }
          }
        } catch (e) {}
      })();
    </script>
